<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"Your Work","maxLength":60},
    {"id":"subtitle","type":"string","label":"Subtitle","default":"Three images, one video","maxLength":100},
    {"id":"image-1","type":"image","label":"Image 1 (SVG/PNG)","default":"assets/slot-1.svg"},
    {"id":"image-2","type":"image","label":"Image 2 (SVG/PNG)","default":"assets/slot-2.svg"},
    {"id":"image-3","type":"image","label":"Image 3 (SVG/PNG)","default":"assets/slot-3.svg"},
    {"id":"bg-color","type":"color","label":"Background Color","default":"#0a0a0f"},
    {"id":"text-color","type":"color","label":"Text Color","default":"#f2f2f5"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SVG Showcase</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        /* var(--token, fallback) so the declared variable drives it and the
           literal only applies when nothing is bound. */
        background: var(--bg-color, #0a0a0f);
        font-family: "Inter", sans-serif;
      }
      /* Sizes are viewport-relative so the same composition holds up when the
         wizard reshapes it to portrait or square. */
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vmin;
        padding: 6vmin;
      }
      #slots {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6vmin;
      }
      .slot {
        width: 22vmin;
        height: 22vmin;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .slot img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #title-text {
        color: var(--text-color, #f2f2f5);
        font-size: 6vmin;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
        max-width: 88%;
      }
      #subtitle-text {
        color: var(--text-color, #f2f2f5);
        opacity: 0.72;
        font-size: 2.6vmin;
        font-weight: 600;
        text-align: center;
        max-width: 84%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage">
        <div id="slots">
          <div class="slot"><img id="slot-1" src="assets/slot-1.svg" alt="" /></div>
          <div class="slot"><img id="slot-2" src="assets/slot-2.svg" alt="" /></div>
          <div class="slot"><img id="slot-3" src="assets/slot-3.svg" alt="" /></div>
        </div>
        <div id="title-text">Your Work</div>
        <div id="subtitle-text">Three images, one video</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var vars =
        window.__hyperframes && window.__hyperframes.getVariables
          ? window.__hyperframes.getVariables()
          : {};

      // The uploaded file is copied into the render's project dir and handed
      // over as an ordinary relative path, so this is a plain src swap — the
      // SVG's own markup is never parsed, which keeps any user file safe.
      var slots = ["image-1", "image-2", "image-3"];
      slots.forEach(function (id, index) {
        var el = document.getElementById("slot-" + (index + 1));
        if (el && vars[id]) el.src = vars[id];
      });

      var titleEl = document.getElementById("title-text");
      var subtitleEl = document.getElementById("subtitle-text");
      if (vars.title) titleEl.textContent = vars.title;
      if (vars.subtitle) subtitleEl.textContent = vars.subtitle;

      // Initial states applied immediately (outside the timeline) — a
      // tl.set(...) at position 0 in a paused timeline does not render while
      // the playhead sits exactly at 0.
      gsap.set(".slot", { opacity: 0, scale: 0.72, y: 40 });
      gsap.set("#title-text", { opacity: 0, y: 28 });
      gsap.set("#subtitle-text", { opacity: 0, y: 20 });

      var tl = gsap.timeline({ paused: true });

      tl.to(".slot", {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 0.7,
        ease: "back.out(1.6)",
        stagger: 0.22,
      }, 0);
      tl.to("#title-text", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.1);
      tl.to("#subtitle-text", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.4);
      tl.to(".slot", { y: -18, duration: 0.8, ease: "power2.inOut", stagger: 0.1 }, 2.4);
      tl.to(
        ["#slots", "#title-text", "#subtitle-text"],
        { opacity: 0, duration: 0.5, ease: "power2.in" },
        5.3,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"question","type":"string","label":"Main Question","default":"Should I learn to code?","maxLength":60},
    {"id":"branch-yes","type":"string","label":"Left Branch","default":"Yes","maxLength":30},
    {"id":"branch-maybe","type":"string","label":"Right Branch","default":"Not sure","maxLength":30},
    {"id":"edge-yes","type":"string","label":"Left Edge Label","default":"Yes","maxLength":20},
    {"id":"edge-maybe","type":"string","label":"Right Edge Label","default":"Not sure","maxLength":20},
    {"id":"leaf-2","type":"string","label":"Result 2","default":"Try no-code first","maxLength":40},
    {"id":"leaf-3","type":"string","label":"Result 3","default":"Build a personal website","maxLength":40},
    {"id":"leaf-4","type":"string","label":"Result 4","default":"Take a free intro course","maxLength":40},
    {"id":"cursor-label","type":"string","label":"Cursor Name","default":"You","maxLength":20},
    {"id":"ink-color","type":"color","label":"Line and Text Color","default":"#333333"},
    {"id":"paper-color","type":"color","label":"Paper Color","default":"#ffffff"},
    {"id":"grid-color","type":"color","label":"Grid Dot Color","default":"#e5e5e5"},
    {"id":"accent-color","type":"color","label":"Cursor Accent Color","default":"#9747ff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Decision Tree</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
        font-family: "Inter", sans-serif;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="decision-tree-comp"
        data-composition-id="decision-tree"
        data-composition-src="compositions/decision_tree.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
